name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 无窗口侧：三平台都能跑全部逻辑自检 + 渲染 + 基线比对。
  # 这是整个跨平台方案最先落地、也最有价值的一块。
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: selftest
        run: cargo run -p minekeeper-cli --release -- --selftest 2000

      # 渲染基线：三平台共用同一份 tiny-skia 光栅器，所以这里可以**精确比对**，
      # 不需要容差。这是相对 Go 方案（Windows 走 GDI+、其他平台自研）的关键优势。
      #
      # 基线缺失会直接失败（退出码 3），不会静默跳过 —— 早期版本写成
      # `if [ -f ... ]` 包一层，结果基线目录空着 CI 也一路绿灯。
      - name: render golden
        run: cargo run -p minekeeper-cli --release -- --golden

  # 窗口侧：只在装了图形栈的 runner 上编译，确保宿主层没有平台编译错误。
  build-gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build -p minekeeper --release

      # 体积守卫：超过 2 MB 说明 profile 配错了或拉进了不该有的依赖。
      - name: size guard
        shell: bash
        run: |
          set -e
          bin=$(find target/release -maxdepth 1 -type f -name 'minekeeper*' | head -1)
          size=$(stat -c%s "$bin" 2>/dev/null || stat -f%z "$bin")
          echo "$bin = $size bytes"
          if [ "$size" -gt 2097152 ]; then
            echo "::error::二进制超过 2 MB，检查 profile 与 feature 开关"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: minekeeper-${{ matrix.os }}
          path: |
            target/release/minekeeper
            target/release/minekeeper.exe
          if-no-files-found: ignore
