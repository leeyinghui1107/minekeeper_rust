name: ci

on:
  push:
    branches: [main, master]
    # tag 也触发：版本号校验只有在 tag 上才有意义（检查 tag 与 Cargo.toml 是否一致），
    # 否则推出去的发布标签可能指向另一个版本。
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 无窗口侧：三平台都能跑全部逻辑自检 + 渲染 + 基线比对。
  # 这是整个跨平台方案最先落地、也最有价值的一块。
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # 两样都是 ubuntu-latest 默认没有的：
      #   fonts-noto-cjk  —— 缺它 `ui_strings_have_no_missing_glyphs` 会报「界面文案缺字」
      #   libasound2-dev  —— mk-host 的音频 feature（cpal）在 Linux 上经 alsa-sys 编译，
      #                      缺头文件会在 build script 阶段直接失败
      - name: install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libasound2-dev

      # 版本号四处手动对齐，没有任何机制保证一致。漏改一处的症状是
      # 「二进制里是 0.1.0、文档写着别的」，而且不会有任何报错。
      # 跑一次就够（与平台无关）。
      - name: version consistency
        if: runner.os == 'Linux'
        run: ./scripts/check-version.sh

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: selftest
        run: cargo run -p minekeeper-cli --release -- --selftest 2000

      # 渲染基线：三平台共用同一份 tiny-skia 光栅器，所以这里可以**精确比对**，
      # 不需要容差。这是相对 Go 方案（Windows 走 GDI+、其他平台自研）的关键优势。
      #
      # 基线缺失会直接失败（退出码 3），不会静默跳过 —— 早期版本写成
      # `if [ -f ... ]` 包一层，结果基线目录空着 CI 也一路绿灯。
      - name: render golden
        run: cargo run -p minekeeper-cli --release -- --golden

  # 窗口侧：只在装了图形栈的 runner 上编译，确保宿主层没有平台编译错误。
  build-gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: build
        run: cargo build -p minekeeper --release

      # 能编译不等于能起窗口。静态 musl 交叉构建的 GUI 就是典型反例：
      # 链接全过，但 winit 的 X11/Wayland 后端靠 dlopen，静态 musl 下必然失败。
      # 这一步真的把窗口建出来、画出第一帧，再自动退出（--smoke-test）。
      # Linux 无显示设备，用 Xvfb 起一个虚拟 X 服务。
      - name: gui smoke test
        shell: bash
        run: |
          set -e
          bin=./target/release/minekeeper
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            # xvfb：虚拟 X 服务。
            # libxkbcommon-x11-0：winit 的 X11 后端在运行时 dlopen 它，
            #   runner 镜像默认没有 —— 缺了会在建窗时 panic 退出（134）。
            sudo apt-get install -y xvfb libxkbcommon-x11-0
            xvfb-run -a "$bin" --smoke-test
          else
            "$bin" --smoke-test
          fi

      # 体积守卫：超过上限说明 profile 配错了（默认 release 口径约翻倍）或拉进了多余依赖。
      # 上限按平台取 —— Linux 的 winit X11/Wayland 后端加 cpal/ALSA，实测 2.61 MB，
      # 而 macOS / Windows 是 1.2–1.5 MB。用同一个数字会在 Linux 上误报。
      - name: size guard
        shell: bash
        run: |
          set -e
          bin=$(find target/release -maxdepth 1 -type f -name 'minekeeper*' | head -1)
          size=$(stat -c%s "$bin" 2>/dev/null || stat -f%z "$bin")
          limit=2097152          # 2 MB：macOS / Windows
          [ "$RUNNER_OS" = "Linux" ] && limit=3145728   # 3 MB：Linux
          echo "$bin = $size bytes (上限 $limit)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::二进制 $size 字节超过上限 $limit，检查 profile 与 feature 开关"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: minekeeper-${{ matrix.os }}
          path: |
            target/release/minekeeper
            target/release/minekeeper.exe
          if-no-files-found: ignore

  # 发布包：只在打 tag 时产出。走的是和本地完全相同的
  # `./scripts/build-all.sh --<平台> --release`，所以 CI 的包和本机构建的是同一回事，
  # 不存在「CI 里另写一套打包逻辑」这种会慢慢漂移的东西。
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libasound2-dev xvfb libxkbcommon-x11-0

      - name: build and package
        shell: bash
        run: |
          set -e
          case "$RUNNER_OS" in
            macOS)   flag=--macos ;;
            Linux)   flag=--linux ;;
            Windows) flag=--windows ;;
          esac
          # macOS 会同时编 arm64 与 x86_64 再 lipo 成通用包；Windows/Linux 编本机。
          # --install-deps：macOS runner 默认只装了 arm64 目标，通用包要两个架构，
          # 缺哪个由脚本自己 rustup target add。
          ./scripts/build-all.sh "$flag" --release --install-deps

      # 包里的二进制必须真的能起窗口。Linux 无显示设备，用 Xvfb。
      - name: smoke test packaged gui
        shell: bash
        run: |
          set -e
          case "$RUNNER_OS" in
            macOS)   bin="dist/macos/MineKeeper.app/Contents/MacOS/minekeeper" ;;
            Linux)   bin="dist/linux-x64/minekeeper" ;;
            Windows) bin="dist/windows-x64/minekeeper.exe" ;;
          esac
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$bin" --smoke-test
          else
            "$bin" --smoke-test
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          # 只传压缩包：SHA256SUMS 由 release job 在合并后统一生成，
          # 三个平台各传一份同名文件会互相覆盖。
          path: dist/release/MineKeeper-*
          if-no-files-found: error

  # 汇总所有平台产物，创建 GitHub Release。
  # 用 runner 自带的 gh CLI 而不是再引一个第三方 action —— 少一个供应链面。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: checksums
        run: |
          set -e
          cd dist/release
          ls -l
          sha256sum MineKeeper-* > SHA256SUMS
          cat SHA256SUMS

      - name: create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="$GITHUB_REF_NAME"
          ver="${tag#v}"

          # 前半段是固定的下载说明与首次运行提示（与手工发布会话里写的一致），
          # 后半段从 CHANGELOG 抽本版本的小节。抽不到就只留前半段。
          {
            cat <<HDR
          Windows XP 扫雷的行为复刻，三平台原生运行。全部图元由代码现画，不含任何微软原版代码或素材。

          ## 下载

          | 平台 | 文件 | 说明 |
          |---|---|---|
          | macOS | \`MineKeeper-v${ver}-macos-universal.zip\` | 通用包（Apple Silicon + Intel），解压后双击 \`MineKeeper.app\` |
          | Windows | \`MineKeeper-v${ver}-windows-x64.zip\` | 解压后双击 \`minekeeper.exe\` |
          | Linux | \`MineKeeper-v${ver}-linux-x64.tar.gz\` | 解压后运行 \`./minekeeper\` |

          每个包都附带 \`minekeeper-cli\`：无窗口的自检 / 出图 / 基线比对工具。

          ## 首次运行提示

          - **macOS**：包是 **ad-hoc 签名**，没有开发者证书与公证。首次打开若被 Gatekeeper 拦下，
            右键 →「打开」，或在「系统设置 → 隐私与安全性」里放行。
          - **Windows**：未做代码签名，SmartScreen 可能提示「未知发布者」，选择「仍要运行」。
          - **Linux**：需要 \`libxkbcommon-x11\` 等 X11 运行库，桌面发行版通常已有；
            无中键的触控板用户可在「游戏 → 单击快速展开」里开启左键快速展开。

          ## 本版内容
          HDR
            awk -v h="## [v$ver]" 'index($0,h)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md
          } > /tmp/notes.md
          # 幂等：重跑同一个 tag 时更新已有 release，而不是报错。
          if gh release view "$tag" >/dev/null 2>&1; then
            # 已存在：换资产 + 刷新说明。只 upload 的话说明会停在旧版本。
            gh release upload "$tag" dist/release/* --clobber
            gh release edit "$tag" --notes-file /tmp/notes.md
          else
            gh release create "$tag" dist/release/* \
              --title "MineKeeper $tag" --notes-file /tmp/notes.md
          fi
